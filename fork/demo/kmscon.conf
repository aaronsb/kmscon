# kmscon config for the local VT demo (fork/demo/run-vt.sh passes this
# directory as --configdir, so /etc/kmscon is never read). It follows tier 3's
# guest config: pango, for its font fallback to CJK and emoji, and no
# blinking. The size is larger than tier 3's for a desktop monitor. Display
# options for one machine (mode=, use-original-mode) go on run-vt.sh's
# command line after --, not here.
font-engine=pango
font-name=DejaVu Sans Mono
font-size=24
no-blink
no-issue
