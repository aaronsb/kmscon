name: Meson

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Both format checks are pinned to the versions fork/lint.mk gives
  # `make lint`; move them together.
  check-format:
    name: Clang-format check
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format-20
    - name: Check clang-format version
      run: clang-format-20 --version && clang-format-20 --version | grep -q 'version 20.1.2 '
    - name: Check format
      run: clang-format-20 -n --Werror src/*.c src/*.h src/*/*.c src/*/*.h tests/*.c tests/*.h
  meson-format:
    name: meson format check
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - name: Install meson
      run: sudo pip install --break-system-packages meson==1.12.1
    - name: Fix meson formatting
      run: meson format --recursive --inplace
    - name: Check for mistakes
      run: |
        if ! git diff --exit-code --color=always; then
          echo "---"
          echo "Please don't forget to run \`meson format --recursive --inplace\`"
          exit 1
        fi
  build:
    name: Ubuntu tests
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - name: Print env
      run: |
        echo github.event.action: ${{ github.event.action }}
        echo github.event_name: ${{ github.event_name }}

    - name: Install dependencies on Ubuntu
      run: sudo apt-get update && sudo apt-get install -y meson check libudev-dev libxkbcommon-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgles-dev libpango1.0-dev libsystemd-dev jq libseat-dev

    - name: Configure Meson
      # images enabled, so the image tests cannot vanish if libpng stops
      # arriving through another package (ADR-103)
      run: meson setup -Dlibseat=enabled -Dimages=enabled build

    - name: Build
      working-directory: ./build
      run: meson compile

    - name: Test
      working-directory: ./build
      run: meson test --print-errorlogs

  # The minimal build and its zlib-free variant (ADR-103): the profile's
  # machine files, its tests, and what its installed files link, checked
  # against a kmscon built with images in the same job (the nm check's control)
  profiles:
    name: ${{ matrix.profile }} build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, zlib-free]
    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies on Ubuntu
      # the profile needs udev, xkbcommon and libdrm, and zlib unless
      # zlib-free; the control, kmscon with images, libpng as well
      run: sudo apt-get update && sudo apt-get install -y meson check libudev-dev libxkbcommon-dev libdrm-dev zlib1g-dev libpng-dev

    - name: Configure the profile
      run: |
        files="--native-file scripts/profiles/minimal.ini"
        if [ "${{ matrix.profile }}" = zlib-free ]; then
          files="$files --native-file scripts/profiles/no-zlib.ini"
        fi
        meson setup build $files

    - name: Build
      run: meson compile -C build

    - name: Test
      run: meson test -C build --print-errorlogs

    - name: Install
      run: meson install -C build --destdir stage

    - name: Build kmscon with images, the nm check's control
      run: |
        meson setup control --force-fallback-for=libtsm -Dlibtsm:default_library=static -Dimages=enabled
        meson compile -C control kmscon

    - name: Check what the installed files link
      run: python3 -I -B tests/check_profile.py ${{ matrix.profile }} build build/stage control/src/kmscon
