# The minimal build (ADR-103, Notes of 2026-10-25): the console with nothing
# it does not need. Text on the screen through DRM or fbdev, read and written
# through a pty, keyboard input through xkbcommon; no images, GL, FreeType,
# Pango or D-Bus. README.md, "Minimal build", says what it keeps and gives up.
#
#   meson setup builddir --native-file scripts/profiles/minimal.ini
#
# A -D given after the file overrides any of these. no-zlib.ini, read after
# this file, makes the zlib-free variant.

[project options]
images = 'disabled'
video_drm3d = 'disabled'
renderer_gltex = 'disabled'
font_freetype = 'disabled'
font_pango = 'disabled'
dbus = 'disabled'
# enabled, so a host without zlib fails the configure instead of building a
# different console
zlib = 'enabled'
font_psf = 'enabled'
font_unifont = 'enabled'

[built-in options]
# libtsm is always the pinned subproject, built static, so kmscon's images
# choice reaches it; a system libtsm built with its decoders cannot satisfy
# the lookup
force_fallback_for = ['libtsm']

[libtsm:built-in options]
default_library = 'static'
