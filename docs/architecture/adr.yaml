# ADR Configuration
# Defines domain numbering and validation rules.
# Used by: docs/scripts/adr  — and, if the doc catalog is installed,
#          docs/scripts/{doc,doclint}: prose docs share these same domain bands
#          (the "shared first octet"; catalog ids are DD.NNN.P). See ADR-302.
#
# Customize domains for your project. Each domain reserves a number range.
# New ADRs get the next available number in their domain.

# Project name (used in generated index)
project_name: kmscon (aaronsb fork)

# Domain Number Series
domains:
  render:
    range: [100, 199]
    name: Render
    description: Glyphs, images and cells to pixels - fonts, text renderers, video backends
    folder: render

  terminal:
    range: [200, 299]
    name: Terminal
    description: Escape protocols and the screen model - libtsm parsing, cells, scrollback
    folder: terminal

  fork:
    range: [300, 399]
    name: Fork
    description: Carrying this fork - upstream tracking, packaging, contribution back
    folder: fork

# The record contract (ADR-304). With `contract: adr/v1`, records are typed:
# each declares a kind, and a decision names a verb, a capability and its
# basis. Delete this line and the v1 blocks below to stay on adr/v0.
contract: adr/v1

kinds:
  decision:
    verb: required
    requires: [capability, basis, agent]
    sections: [Summary]
    edges: { supersedes: decision, amends: decision, extends: decision, basis: [decision, spec, evidence] }
  spec:
    verb: forbidden
    requires: [capability]
    edges: { supersedes: spec, decided_by: decision }
  evidence:
    verb: forbidden
    requires: [capability]
    edges: { supersedes: evidence }

# What the project does, one line each. A record's `capability` names one of
# these, and a decision adds, cuts, changes or constrains them. Replace the
# `core` placeholder with the project's own list. `process` and `adr` apply
# to every project that keeps these records.
capabilities:
  glyphs: Font loading and glyph rasterisation, including colour glyphs and fallback
  images: Inline images - sixel and the kitty graphics protocol - stored, placed and drawn
  text-style: Cell attributes beyond colour - underline styles and colours, italics, blink
  cell-model: libtsm's screen, cell and scrollback representation
  renderer: Text renderers (bbulk, gltex) and the interface kmscon calls them through
  backends: Video backends (drm2d, drm3d, fbdev) and the pixel operations they expose
  protocols: Escape-sequence parsing and replies (DCS, APC, OSC, SGR, DA)
  packaging: How the fork is built, packaged and installed
  upstream: Tracking kmscon and libtsm upstream and offering work back
  process: Conventions, documentation and the development process that belong to no product capability
  adr: Decision records, their contract and the adr tool

# This repository, as URLs name it (host/owner/repo, or a list). A URL into
# it at a branch is a path in the tree: `adr domain` rewrites it when a
# record moves. Without this key the origin remote is used, so set it to
# rewrite the same URLs in every clone.
repository: github.com/aaronsb/kmscon

# Valid ADR statuses (adr/v0 records)
statuses:
  - Draft         # Initial creation, not yet proposed
  - Proposed      # Under discussion/review
  - Accepted      # Approved and ready for implementation
  - Superseded    # Replaced by another ADR
  - Deprecated    # No longer relevant
  - Rejected      # Decided against; kept for the record

# Default values for new ADRs
defaults:
  deciders: [aaronsb]
  status: Draft

# Legacy ADR range (pre-domain numbering)
legacy:
  range: [1, 99]
  label: "Legacy"
  # retired: true   # Uncomment ONLY if the legacy range is VACATED (its ADRs
  #                 # were renumbered into domains). doclint then fails on any
  #                 # reference into the range. Leave off if the project still
  #                 # uses its legacy numbers (the common case).
  # defining_adr: ADR-NNN   # With retired: true, exempt the ADR that vacated the
  #                         # range — it names retired numbers legitimately.

# Viewer command for `adr view` (use {file} as placeholder)
# Options: cat {file}, glow {file}, bat {file}
viewer: cat {file}
