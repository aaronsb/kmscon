# The zlib-free variant of the minimal build (ADR-103, The zlib-free variant):
# no zlib at all, so no unifont, and mod-psf reads uncompressed fonts only.
#
#   meson setup builddir --native-file scripts/profiles/minimal.ini \
#       --native-file scripts/profiles/no-zlib.ini

[project options]
zlib = 'disabled'
font_unifont = 'disabled'
