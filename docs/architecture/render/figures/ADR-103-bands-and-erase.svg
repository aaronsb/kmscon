<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="DejaVu Sans Mono, monospace" font-size="13">
<rect width="640" height="560" rx="8" fill="#f8fafc"/>
<text x="20" y="28" fill="#1a1a1a" font-weight="bold">A. Draw order of one frame, first drawn at the bottom</text>
<g>
<rect x="60" y="226" width="400" height="28" fill="#475569"/><text x="72" y="245" fill="#ffffff">1 default background</text>
<rect x="76" y="192" width="400" height="28" fill="#2d7d9a"/><text x="88" y="211" fill="#ffffff">2 placements, z &lt; -1,073,741,824</text>
<rect x="92" y="158" width="400" height="28" fill="#94a3b8"/><text x="104" y="177" fill="#1a1a1a">3 cell backgrounds that are not the default</text>
<rect x="108" y="124" width="400" height="28" fill="#2d7d9a"/><text x="120" y="143" fill="#ffffff">4 placements, -1,073,741,824 &lt;= z &lt; 0</text>
<rect x="124" y="90" width="400" height="28" fill="#1a1a1a"/><text x="136" y="109" fill="#ffffff">5 glyph and decoration sprites</text>
<rect x="140" y="56" width="400" height="28" fill="#f6821f"/><text x="152" y="75" fill="#1a1a1a">6 placements, z &gt;= 0, and every sixel</text>
</g>
<text x="20" y="282" fill="#1a1a1a">Layer 2 shows only through cells whose background is the default.</text>
<line x1="20" y1="300" x2="620" y2="300" stroke="#94a3b8"/>
<text x="20" y="326" fill="#1a1a1a" font-weight="bold">B. EL erases row 3 (dashed), which crosses both images</text>
<text x="40" y="352" fill="#1a1a1a">before</text>
<text x="340" y="352" fill="#1a1a1a">after</text>
<g transform="translate(40,362)">
<rect width="240" height="144" fill="#ffffff" stroke="#4a5568"/>
<rect x="20" y="24" width="80" height="96" fill="#f6821f"/>
<rect x="140" y="24" width="80" height="96" fill="#2d7d9a"/>
<rect x="0" y="72" width="240" height="24" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3"/>
<text x="44" y="56" fill="#1a1a1a">sixel</text>
<text x="160" y="56" fill="#ffffff">kitty</text>
</g>
<g transform="translate(340,362)">
<rect width="240" height="144" fill="#ffffff" stroke="#4a5568"/>
<rect x="20" y="24" width="80" height="48" fill="#f6821f"/>
<rect x="20" y="96" width="80" height="24" fill="#f6821f"/>
<rect x="140" y="24" width="80" height="96" fill="#2d7d9a"/>
<rect x="0" y="72" width="240" height="24" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3"/>
<text x="44" y="56" fill="#1a1a1a">sixel</text>
<text x="160" y="56" fill="#ffffff">kitty</text>
</g>
<text x="20" y="530" fill="#1a1a1a">The sixel loses the erased row and stays as two pieces of one image.</text>
<text x="20" y="548" fill="#1a1a1a">The kitty placement is untouched: of the erase commands, only ED 2 removes it.</text>
</svg>
