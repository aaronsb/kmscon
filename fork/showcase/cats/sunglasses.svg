<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 39 7" width="780" height="140" shape-rendering="crispEdges">
  <title>Pixel sunglasses</title>
  <!-- frame -->
  <g fill="#000">
    <rect x="0" y="0" width="26" height="1"/>
    <!-- arm -->
    <rect x="26" y="0" width="8" height="1"/>
    <rect x="33" y="1" width="4" height="1"/>
    <!-- left lens -->
    <rect x="0" y="1" width="12" height="1"/>
    <rect x="1" y="2" width="10" height="1"/>
    <rect x="2" y="3" width="8" height="1"/>
    <rect x="3" y="4" width="7" height="1"/>
    <!-- right lens -->
    <rect x="14" y="1" width="12" height="1"/>
    <rect x="15" y="2" width="10" height="1"/>
    <rect x="16" y="3" width="8" height="1"/>
    <rect x="16" y="4" width="7" height="1"/>
  </g>
  <!-- glints -->
  <g fill="#fff">
    <rect x="2" y="1" width="1" height="1"/>
    <rect x="4" y="1" width="1" height="1"/>
    <rect x="3" y="2" width="1" height="1"/>
    <rect x="5" y="2" width="1" height="1"/>
    <rect x="4" y="3" width="1" height="1"/>
    <rect x="6" y="3" width="1" height="1"/>
    <rect x="16" y="1" width="1" height="1"/>
    <rect x="18" y="1" width="1" height="1"/>
    <rect x="17" y="2" width="1" height="1"/>
    <rect x="19" y="2" width="1" height="1"/>
    <rect x="18" y="3" width="1" height="1"/>
    <rect x="20" y="3" width="1" height="1"/>
  </g>
</svg>
