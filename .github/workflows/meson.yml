name: Meson

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Both format checks are pinned to the versions fork/lint.mk gives
  # `make lint`; move them together.
  check-format:
    name: Clang-format check
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format-20
    - name: Check clang-format version
      run: clang-format-20 --version && clang-format-20 --version | grep -q 'version 20.1.2 '
    - name: Check format
      run: clang-format-20 -n --Werror src/*.c src/*.h src/*/*.c src/*/*.h tests/*.c tests/*.h
  meson-format:
    name: meson format check
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - name: Install meson
      run: sudo pip install --break-system-packages meson==1.12.1
    - name: Fix meson formatting
      run: meson format --recursive --inplace
    - name: Check for mistakes
      run: |
        if ! git diff --exit-code --color=always; then
          echo "---"
          echo "Please don't forget to run \`meson format --recursive --inplace\`"
          exit 1
        fi
  build:
    name: Ubuntu tests
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - name: Print env
      run: |
        echo github.event.action: ${{ github.event.action }}
        echo github.event_name: ${{ github.event_name }}

    - name: Install dependencies on Ubuntu
      run: sudo apt-get update && sudo apt-get install -y meson check libudev-dev libxkbcommon-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgles-dev libpango1.0-dev libsystemd-dev jq libseat-dev

    - name: Configure Meson
      # images and zlib enabled, so the image tests and gzip fonts cannot
      # vanish if libpng or zlib stops arriving through another package
      # (ADR-103)
      run: meson setup -Dlibseat=enabled -Dimages=enabled -Dzlib=enabled build

    - name: Build
      working-directory: ./build
      run: meson compile

    - name: Test
      working-directory: ./build
      run: meson test --print-errorlogs

