# kmscon config for the local VT demo (fork/demo/run-vt.sh passes this
# directory as --configdir, so /etc/kmscon is never read). It follows tier 3's
# guest config in using pango, for its font fallback to CJK and emoji. It
# differs from it in leaving blinking on, kmscon's default: tier 3 compares
# captures with goldens and turns blinking off so a capture does not depend on
# the phase, while the demo is for a person to watch, so the blink page and the
# cursor blink as they would for a user. The size is larger than tier 3's for a
# desktop monitor. Display options for one machine (mode=, use-original-mode)
# go on run-vt.sh's command line after --, not here.
font-engine=pango
font-name=DejaVu Sans Mono
font-size=24
no-issue
